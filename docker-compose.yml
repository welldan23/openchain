# PostgreSQL lokal untuk pengembangan. Kredensial di sini khusus lokal dan
# sama dengan apps/api/.env.example. Jangan dipakai di server sungguhan.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openchain
      POSTGRES_PASSWORD: openchain
      POSTGRES_DB: openchain
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openchain -d openchain"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
